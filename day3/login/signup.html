<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
          <div class="card shadow-sm p-3">
            <div class="text-center mb-3">
              <h4 class="mb-0">Sign Up</h4>
            </div>

            <form id="sign-up-form" novalidate>
              <div class="row mb-2">
                <div class="col-md-6">
                  <label for="fullname" class="form-label">Full Name</label>
                  <input
                    type="text"
                    class="form-control form-control-sm"
                    id="fullname"
                    placeholder="Enter Full Name"
                  />
                  <span id="full-name-error" class="text-danger small"></span>
                </div>

                <div class="col-md-6">
                  <label for="nickname" class="form-label">Nickname</label>
                  <input
                    type="text"
                    class="form-control form-control-sm"
                    id="nickname"
                    placeholder="Enter Nickname"
                  />
                  <span id="nickname-error" class="text-danger small"></span>
                </div>
              </div>

              <div class="mb-2">
                <label for="username" class="form-label">Username</label>
                <input
                  type="text"
                  class="form-control form-control-sm"
                  id="username"
                  placeholder="Enter username or email"
                />
                <span id="username-error" class="text-danger small"></span>
              </div>

              <div class="mb-2">
                <label for="email" class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control form-control-sm"
                  id="email"
                  placeholder="Enter your email"
                />
                <span id="email-error" class="text-danger small"></span>
              </div>

              <div class="mb-2">
                <label for="address" class="form-label">Address</label>
                <input
                  type="text"
                  class="form-control form-control-sm"
                  id="address"
                  placeholder="Enter your address"
                />
                <span id="address-error" class="text-danger small"></span>
              </div>

              <div class="row mb-2">
                <div class="col-md-6">
                  <label for="birthday" class="form-label">Birthday</label>
                  <input
                    type="date"
                    class="form-control form-control-sm"
                    id="birthday"
                  />
                </div>

                <div class="col-md-6">
                  <label for="contact" class="form-label">Contact Number</label>
                  <input
                    type="tel"
                    class="form-control form-control-sm"
                    id="contact"
                    placeholder="Enter phone number"
                  />
                  <span id="contact-error" class="text-danger small"></span>
                </div>
              </div>

              <div class="mb-2">
                <label for="password" class="form-label">Password</label>
                <input
                  type="password"
                  class="form-control form-control-sm"
                  id="password"
                  placeholder="Enter password"
                />
                <span id="password-error" class="text-danger small"></span>
              </div>

              <div class="mb-2">
                <label for="confirm-password" class="form-label"
                  >Confirm Password</label
                >
                <input
                  type="password"
                  class="form-control form-control-sm"
                  id="confirm-password"
                  placeholder="Confirm Password"
                />
                <span
                  id="confirm-password-error"
                  class="text-danger small"
                ></span>
              </div>

              <button type="submit" class="btn btn-primary w-100 mb-2 btn-sm">
                Sign Up
              </button>

              <p class="text-center small">
                Already have an account? <a href="login.html">Login</a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
