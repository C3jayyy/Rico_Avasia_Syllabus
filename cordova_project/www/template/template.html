<script id="sign-up-page" type="text/html">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="card shadow-sm p-3">
          <div class="text-center mb-3">
            <h4 class="mb-0">Sign Up</h4>
          </div>

          <form id="sign-up-form" novalidate>
            <div class="row mb-2">
              <div class="col-md-6">
                <label for="fullname" class="form-label">Full Name</label>
                <input
                  type="text"
                  class="form-control form-control-sm"
                  id="fullname"
                  name="fullname"
                  placeholder="Enter Full Name"
                />
                <span id="full-name-error" class="text-danger small"></span>
              </div>

              <div class="col-md-6">
                <label for="nickname" class="form-label">Nickname</label>
                <input
                  type="text"
                  class="form-control form-control-sm"
                  id="nickname"
                  name="nickname"
                  placeholder="Enter Nickname"
                />
                <span id="nickname-error" class="text-danger small"></span>
              </div>
            </div>

            <div class="mb-2">
              <label for="username" class="form-label">Username</label>
              <input
                type="text"
                class="form-control form-control-sm"
                id="username"
                name="username"
                placeholder="Enter username or email"
              />
              <span id="username-error" class="text-danger small"></span>
            </div>

            <div class="mb-2">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                class="form-control form-control-sm"
                id="email"
                name="email"
                placeholder="Enter your email"
              />
              <span id="email-error" class="text-danger small"></span>
            </div>

            <div class="mb-2">
              <label for="address" class="form-label">Address</label>
              <input
                type="text"
                class="form-control form-control-sm"
                id="address"
                name="address"
                placeholder="Enter your address"
              />
              <span id="address-error" class="text-danger small"></span>
            </div>

            <div class="row mb-2">
              <div class="col-md-6">
                <label for="birthday" class="form-label">Birthday</label>
                <input
                  type="date"
                  class="form-control form-control-sm"
                  id="birthday"
                  name="birthday"
                />
              </div>

              <div class="col-md-6">
                <label for="contact" class="form-label">Contact Number</label>
                <input
                  type="tel"
                  class="form-control form-control-sm"
                  id="contact"
                  name="contact"
                  placeholder="Enter phone number"
                />
                <span id="contact-error" class="text-danger small"></span>
              </div>
            </div>

            <div class="mb-2">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                class="form-control form-control-sm"
                id="password"
                name="password"
                placeholder="Enter password"
              />
              <span id="password-error" class="text-danger small"></span>
            </div>

            <div class="mb-2">
              <label for="confirm-password" class="form-label"
                >Confirm Password</label
              >
              <input
                type="password"
                class="form-control form-control-sm"
                id="confirm-password"
                name="confirm-password"
                placeholder="Confirm Password"
              />
              <span
                id="confirm-password-error"
                class="text-danger small"
              ></span>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-2 btn-sm">
              Sign Up
            </button>

            <p class="text-center small">
              Already have an account? <a href="#/login">Login</a>
            </p>
          </form>
        </div>
      </div>
    </div>
  </div>
</script>

<script id="login-page" type="text/html">
  <div
    class="container d-flex justify-content-center align-items-center vh-100"
  >
    <div class="card shadow p-4" style="width: 100%; max-width: 350px">
      <div class="text-center mb-4">
        <h4>Login</h4>
      </div>

      <form id="login-form">
        <div class="mb-2">
          <label for="username" class="form-label">Username or Email</label>
          <input
            type="text"
            class="form-control"
            id="username"
            name="username"
            placeholder="Enter username or email"
            required
          />
        </div>

        <div class="mb-2">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            placeholder="Enter password"
            required
          />
        </div>

        <div class="mb-2 form-check">
          <input
            type="checkbox"
            class="form-check-input"
            id="rememberMe"
            name="remember"
          />
          <label class="form-check-label" for="rememberMe"> Remember me </label>
        </div>

        <button id="login-btn" type="submit" class="btn btn-primary w-100 mb-3">
          Login
        </button>

        <div class="d-flex justify-content-between">
          <a href="#/home" class="btn btn-danger w-100 mb-3">Cancel</a>
        </div>
        <a href="#" class="text-decoration-none">Forgot password?</a><br />
        <p>
          Don't have an account?<a href="#/signup" class="text-decoration-none"
            >Sign up</a
          >
        </p>
      </form>
    </div>
  </div>
</script>

<script id="profile" type="text/html">
  <main class="container" style="margin-top: 100px; margin-bottom: 100px;">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body text-center bg-dark text-white rounded-top-4">
            <h3>{{username}}</h3>
            <p class="mb-0">{{email}}</p>
          </div>

          <div class="card-body">
            <div class="mb-3">
              <label class="form-label fw-bold">Full Name</label>
              <input
                type="text"
                id="edit-fullname"
                class="form-control"
                value="{{full_name}}"
                disabled
              />
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Nickname</label>
              <input
                type="text"
                id="edit-nickname"
                class="form-control form-control-sm"
                value="{{nick_name}}"
                disabled
              />
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Birthday</label>
              <input
                type="date"
                id="edit-birthday"
                class="form-control"
                value="{{birthday}}"
                disabled
              />
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Contact Number</label>
              <input
                type="text"
                id="edit-contact"
                class="form-control form-control-sm"
                value="{{contact_number}}"
                disabled
              />
            </div>

            <button id="update-btn" class="btn btn-primary w-100 mt-3">
              Edit Profile
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>
</script>
